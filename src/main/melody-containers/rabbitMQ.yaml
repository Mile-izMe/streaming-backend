version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: melody_rabbitmq
    ports:
      - "5672:5672"   # Port for Spring Boot to connect (AMQP)
      - "15672:15672" # Port for Web UI (for debugging)
    environment:
      RABBITMQ_DEFAULT_USER: melody
      RABBITMQ_DEFAULT_PASS: melody123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: